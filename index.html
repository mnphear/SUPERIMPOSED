<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnets Studio — Prop House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --paper:#E4E2DB;
  --card:#F3F2ED;
  --ink:#17181A;
  --soft:#6A6B64;
  --rule:#C6C4BA;
  --blue:#1E2BD6;
  --blue-wash:rgba(30,43,214,.07);
  --shelf:#D6D3CA;
  --s:8px;
  --maxw:1560px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}

.hidden{display:none !important}
.adminbar{
  position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;gap:12px;padding:9px 18px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;
}
.adminbar .tag{background:var(--paper);color:var(--ink);padding:2px 8px;text-transform:uppercase;font-weight:600}
.adminbar.dirty .tag{background:var(--blue);color:#fff}
.adminbar .sp{flex:1}
.adminbar .topbtn{border-color:var(--paper);color:var(--paper)}
.adminbar .topbtn:hover{background:var(--paper);color:var(--ink)}
body.hasbar{padding-bottom:44px}
.editbtn{margin-left:8px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.wide{font-family:"Archivo",system-ui,sans-serif;font-variation-settings:"wdth" 125;letter-spacing:-.01em}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

/* ---------- top bar ---------- */
.topbar{
  border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:40;
  background:var(--paper);
}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:46px}
.brand{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink);white-space:nowrap;
}
.brand span{color:var(--soft)}
.topbar .spacer{flex:1}
.topbtn{
  background:none;border:1px solid var(--ink);border-radius:0;
  padding:5px 12px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;
}
.topbtn:hover{background:var(--ink);color:var(--paper)}
.topbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.topbtn.primary:hover{background:var(--ink);border-color:var(--ink)}
.topbtn .count{font-weight:600}

/* ---------- masthead ---------- */
.masthead{padding:44px 0 22px;border-bottom:1px solid var(--rule)}
.masthead h1{
  font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 125;
  font-weight:800;text-transform:uppercase;
  font-size:clamp(34px,7.2vw,86px);line-height:.9;letter-spacing:-.03em;
  margin:0 0 6px;
}
.masthead .sub{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--soft);margin-bottom:26px;
}
.searchrow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.searchfield{flex:1;min-width:280px;position:relative;border-bottom:2px solid var(--ink)}
.searchfield input{
  width:100%;background:none;border:0;outline:none;
  font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 100;
  font-size:clamp(20px,3.2vw,34px);font-weight:500;padding:2px 0 8px;
}
.searchfield input::placeholder{color:#A9A79E}
.searchfield:focus-within{border-color:var(--blue)}
.tally{
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--soft);
  padding-bottom:10px;white-space:nowrap;letter-spacing:.06em;
}
.tally b{color:var(--ink);font-weight:600}

/* ---------- controls ---------- */
.controls{
  position:sticky;top:46px;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.controls .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.chip{
  border:1px solid var(--rule);background:transparent;border-radius:999px;
  padding:5px 13px;font-size:12.5px;letter-spacing:.02em;white-space:nowrap;
}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.55;margin-left:6px}
.divider{width:1px;height:22px;background:var(--rule)}
.ctrl{display:flex;align-items:center;gap:7px;font-family:"IBM Plex Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--soft)}
.ctrl input[type=range]{width:110px;accent-color:var(--blue)}
.ctrl select{background:none;border:1px solid var(--rule);padding:4px 8px;font-family:"IBM Plex Mono",monospace;font-size:11px}
.ctrl b{color:var(--ink);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-family:"IBM Plex Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.09em;text-decoration:underline;text-underline-offset:3px}

/* ---------- grid ---------- */
.sectionhead{
  display:flex;align-items:baseline;gap:14px;
  padding:34px 0 12px;
}
.sectionhead .num{
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--blue);letter-spacing:.1em;
}
.sectionhead h2{
  font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 112;
  font-weight:700;text-transform:uppercase;font-size:20px;letter-spacing:.01em;margin:0;
}
.sectionhead .rule{flex:1;height:1px;background:var(--rule);position:relative;top:-4px}
.sectionhead .cnt{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soft)}

.grid{
  display:grid;gap:26px 20px;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  padding-bottom:20px;
}
.card{
  background:transparent;border:0;padding:0;text-align:left;
  display:flex;flex-direction:column;
}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.thumb{
  position:relative;aspect-ratio:4/3;background:var(--card);
  border:1px solid var(--rule);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.card:hover .thumb{border-color:var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  color:#A9A79E;text-transform:uppercase;text-align:center;padding:10px;
}
.thumb .sku{
  position:absolute;left:0;top:0;background:var(--ink);color:var(--paper);
  font-family:"IBM Plex Mono",monospace;font-size:10px;padding:3px 7px;letter-spacing:.06em;
}
.thumb .qty{
  position:absolute;right:0;top:0;background:var(--blue);color:#fff;
  font-family:"IBM Plex Mono",monospace;font-size:10px;padding:3px 7px;letter-spacing:.06em;
}
.card .name{
  font-size:14.5px;font-weight:500;margin:9px 0 3px;line-height:1.25;
}
.card .dims{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soft);letter-spacing:.02em}
.scale{display:block;margin-top:8px;width:100%;height:16px}
.inreq{
  margin-top:7px;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--blue);
}
.card .rate{
  font-family:"IBM Plex Mono",monospace;font-size:12px;margin-top:4px;font-weight:600;
}
.card .rate span{color:var(--soft);font-weight:400;font-size:10.5px}
.quote{border-top:1px solid var(--ink);margin-top:4px;padding:12px 0 4px}
.quote div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;
  font-family:"IBM Plex Mono",monospace;font-size:12px}
.quote div.big{font-size:15px;font-weight:600;border-top:1px solid var(--rule);margin-top:6px;padding-top:8px}
.quote div span:first-child{color:var(--soft)}
.quote div.big span:first-child{color:var(--ink)}
.quote .hint{display:block;color:var(--soft);font-size:10.5px;padding-top:8px;line-height:1.55}
.drawerterms{border-top:1px solid var(--rule);padding:14px 0 18px}
.drawerterms h4{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;margin:0 0 6px;color:var(--ink)}
.drawerterms p{margin:0;font-size:12px;line-height:1.6;color:var(--soft)}
.line .lr{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soft);margin-top:3px}
.todo{
  margin-top:6px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  border:1px dashed var(--rule);display:inline-block;padding:2px 6px;margin-right:5px;
}
.thumb .shots{
  position:absolute;left:0;bottom:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;padding:2px 6px;letter-spacing:.06em;
  border-top:1px solid var(--rule);border-right:1px solid var(--rule);
}
.strip{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule);background:var(--card);flex-wrap:wrap}
.strip button{width:52px;height:52px;border:1px solid var(--rule);background:none;padding:0;overflow:hidden}
.strip button[aria-pressed="true"]{border-color:var(--blue);border-width:2px}
.strip img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- empty ---------- */
.empty{padding:70px 0 100px;max-width:520px}
.empty h3{font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 115;text-transform:uppercase;font-size:22px;margin:0 0 8px}
.empty p{color:var(--soft);margin:0 0 14px}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(23,24,26,.55);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:22px;
}
.sheet{
  background:var(--paper);border:1px solid var(--ink);max-width:900px;width:100%;
  max-height:88vh;overflow:auto;
}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper)}
.sheet .hd .t{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase}
.x{background:none;border:0;font-size:20px;line-height:1;padding:4px 6px}
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:0}
.detail .picwrap{border-right:1px solid var(--rule);display:flex;flex-direction:column}
.detail .pic{background:var(--card);flex:1;min-height:330px;display:flex;align-items:center;justify-content:center}
.detail .pic img{width:100%;height:100%;max-height:520px;object-fit:contain}
.detail .pic .ph{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#A9A79E;letter-spacing:.1em;text-align:center;padding:20px}
.detail .info{padding:22px 24px 26px}
.detail h3{font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 112;font-weight:700;font-size:26px;line-height:1.05;margin:6px 0 10px;text-transform:uppercase}
.detail .desc{margin:0 0 18px}
.dl{border-top:1px solid var(--rule);margin:0}
.dl dt,.dl dd{margin:0}
.dl div{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--rule);font-family:"IBM Plex Mono",monospace;font-size:12px}
.dl dt{color:var(--soft);text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.addrow{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.stepper{display:flex;border:1px solid var(--ink)}
.stepper button{background:none;border:0;padding:6px 12px;font-family:"IBM Plex Mono",monospace}
.stepper button:hover{background:var(--ink);color:var(--paper)}
.stepper span{padding:6px 10px;min-width:44px;text-align:center;font-family:"IBM Plex Mono",monospace;border-left:1px solid var(--ink);border-right:1px solid var(--ink)}
.bigbtn{
  background:var(--blue);color:#fff;border:1px solid var(--blue);padding:8px 18px;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;
}
.bigbtn:hover{background:var(--ink);border-color:var(--ink)}
.bigbtn.ghost{background:none;color:var(--ink);border-color:var(--ink)}
.bigbtn.ghost:hover{background:var(--ink);color:var(--paper)}
.bigbtn[disabled]{opacity:.4;pointer-events:none}

/* ---------- request drawer ---------- */
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(460px,100%);
  background:var(--paper);border-left:1px solid var(--ink);z-index:70;
  display:flex;flex-direction:column;
}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--ink)}
.drawer .body{flex:1;overflow:auto;padding:0 18px}
.drawer .ft{border-top:1px solid var(--ink);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap}
.line{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule);align-items:flex-start}
.line .lt{width:56px;height:56px;flex:none;background:var(--card);border:1px solid var(--rule);overflow:hidden;display:flex;align-items:center;justify-content:center}
.line .lt img{width:100%;height:100%;object-fit:cover}
.line .lt span{font-family:"IBM Plex Mono",monospace;font-size:9px;color:#A9A79E}
.line .lb{flex:1;min-width:0}
.line .lb .n{font-size:13.5px;font-weight:500;line-height:1.2}
.line .lb .m{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--soft);margin-top:3px}
.line .lq{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:12px}
.line .lq button{background:none;border:1px solid var(--rule);width:22px;height:22px;line-height:1;padding:0}
.line .lq button:hover{border-color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 0}
.fields label{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.fields input,.fields textarea{width:100%;background:var(--card);border:1px solid var(--rule);padding:7px 9px;font-size:13px}
.fields .full{grid-column:1/-1}
.fields .grouphd{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--ink);
  padding-bottom:4px;margin-top:8px;
}
.fields .grouphd:first-child{margin-top:0}
.fields .same{
  display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--soft);
  font-family:"Instrument Sans",sans-serif;text-transform:none;letter-spacing:0;margin-bottom:0;
}
.fields .same input{width:auto}
.drawer .ft{border-top:1px solid var(--ink);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fields input:focus,.fields textarea:focus{outline:none;border-color:var(--blue)}

/* ---------- settings ---------- */
.panel{padding:20px 22px 26px;max-width:760px}
.panel h4{font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 112;text-transform:uppercase;font-size:15px;margin:22px 0 6px}
.panel h4:first-child{margin-top:0}
.panel p{color:var(--soft);font-size:13.5px;margin:0 0 10px}
.panel code{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--card);border:1px solid var(--rule);padding:1px 5px}
.bandgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.pricegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.bandgrid label,.pricegrid label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.bandgrid label em{font-style:normal;opacity:.65}
.bandgrid input,.pricegrid input{width:100%;background:var(--card);border:1px solid var(--rule);
  padding:7px 8px;font-family:"IBM Plex Mono",monospace;font-size:12px}
.bandgrid input:focus,.pricegrid input:focus{outline:none;border-color:var(--blue)}
@media (max-width:620px){.bandgrid{grid-template-columns:repeat(3,1fr)}.pricegrid{grid-template-columns:repeat(2,1fr)}}
.panel input[type=text]{width:100%;background:var(--card);border:1px solid var(--rule);padding:8px 10px;font-family:"IBM Plex Mono",monospace;font-size:12px}
.panel textarea{width:100%;height:120px;background:var(--card);border:1px solid var(--rule);padding:8px 10px;font-family:"IBM Plex Mono",monospace;font-size:11.5px}
.filebtn{display:inline-block;border:1px solid var(--ink);padding:7px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;cursor:pointer}
.filebtn:hover{background:var(--ink);color:var(--paper)}
.filebtn input{display:none}
.note{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--blue);margin-top:8px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

footer{border-top:1px solid var(--rule);margin-top:40px;padding:26px 0 60px}
footer .terms{max-width:620px;padding-bottom:22px}
footer .terms h3{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink);margin:0 0 7px;
}
footer .terms p{margin:0;font-size:13.5px;line-height:1.6;color:var(--soft)}
footer .footrow{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soft);
  letter-spacing:.06em;text-transform:uppercase;border-top:1px solid var(--rule);padding-top:16px}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;z-index:90;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
}

@media (max-width:720px){
  .detail{grid-template-columns:1fr}
  .detail .picwrap{border-right:0;border-bottom:1px solid var(--rule)}
  .detail .pic{min-height:240px}
  .masthead{padding:28px 0 18px}
  .controls{position:static}
}
@media (prefers-reduced-motion:no-preference){
  .card .thumb,.chip,.topbtn{transition:border-color .15s ease,background .15s ease,color .15s ease}
}
@media print{
  .topbar,.controls,.masthead,.grid,.sectionhead,footer,.scrim{display:none!important}
  .drawer{position:static;width:100%;border:0}
  .drawer .ft,.drawer .hd .x{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="brand">Magnets Studio <span>/ Prop House · Ljubljana</span></div>
    <div class="spacer"></div>
    <button class="topbtn hidden" id="btnSettings">Catalogue + photos</button>
    <button class="topbtn primary" id="btnReq">Request list <span class="count" id="reqCount">0</span></button>
  </div>
</div>

<header class="masthead">
  <div class="wrap">
    <h1>Prop&nbsp;house</h1>
    <div class="sub">Search the shelves · sizes in centimetres · rental by request</div>
    <div class="searchrow">
      <div class="searchfield">
        <input id="q" type="search" placeholder="glass jar, wooden, cutting board, 01.23…" autocomplete="off" aria-label="Search props">
      </div>
      <div class="tally" id="tally"></div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="wrap" id="controls"></div>
</div>

<main class="wrap" id="results"></main>

<footer>
  <div class="wrap">
    <div class="terms">
      <h3>Damage &amp; loss</h3>
      <p id="damageTerms"></p>
    </div>
  </div>
  <div class="wrap footrow">
    <div>Magnets Studio — prop rental</div>
    <div><span id="footcount"></span> · <button class="linkbtn" id="studioLink">Studio</button></div>
  </div>
</footer>

<script>
/* ============================================================
   CATALOGUE
   Transcribed from the Google Sheet "Magnets Studio props".
   sku  – code used to match the photo filename
   src  – the exact row name in the sheet (kept for matching)
   h/w/d – centimetres, null when the sheet leaves it blank
   ============================================================ */
const SEED = [
{sku:"01.01",cat:"01",name:"Glass jar",src:"01.01_glass jar",h:28.5,w:10.5,d:null,qty:1,desc:"Tall glass jar with glass lid, empty",files:["01.01_glass jar.jpg"]},
{sku:"01.02",cat:"01",name:"Glass jar",src:"01.02_glass jar",h:28.5,w:10.5,d:null,qty:1,desc:"Tall glass jar with wooden lid, wholegrain pasta",files:["01.02_glass jar.jpg"]},

const store = {
  async get(k){
    try{
      if(window.storage && window.storage.get){const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null;}
      const v = localStorage.getItem(k); return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  },
  async set(k,v){
    try{
      if(window.storage && window.storage.set){ await window.storage.set(k, JSON.stringify(v)); return; }
      localStorage.setItem(k, JSON.stringify(v));
    }catch(e){}
  }
};

let items = SEED.slice();
let imgMap = {};            // sku -> [object URLs] from a picked folder
let imgBase = "";           // optional public base URL for photos
let useFolders = true;      // photos sit in "01 - Kitchen" style subfolders
let manifestMode = false;   // files came from prep_props.py, so thumb/ and web/ exist
let req = {};               // sku -> count

            contact:"",email:"",phone:"",sameBill:true,billTo:"",vat:"",po:"",

/* a prop is incomplete if the sheet has no measurements or description for it,
   or if no photo file carries its number */
const needsSpecs = it => !it.desc && it.h==null && it.w==null && it.d==null;
const needsPhoto = it => !(it.files && it.files.length) && !(imgMap[it.sku]||[]).length;

const MATERIALS = [
  ["glass",/glass/i],["wood",/wood|cork|walnut/i],["metal",/metal|steel/i],
  ["plastic",/plastic/i],["fabric",/apron|glove|cloth|leather/i],["electric",/electric|induction|infrared|mixer|kettle/i]
];
function materialsOf(it){
  const hay = (it.name+" "+it.desc).toLowerCase();
  return MATERIALS.filter(([n,re])=>re.test(hay)).map(([n])=>n);
}

/* ============================================================
   HELPERS
   ============================================================ */
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!==undefined)n.innerHTML=h; return n;};
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => (v===null||v===undefined||v==="") ? null : (isNaN(parseFloat(v)) ? null : parseFloat(v));

function dimsLine(it){
  const p=[];
  if(it.h!=null)p.push("H "+it.h);
  if(it.w!=null)p.push("W "+it.w);
  if(it.d!=null)p.push("D "+it.d);
  return p.length ? p.join(" × ")+" cm" : "no size recorded";
}
function longest(it){ return Math.max(it.h||0,it.w||0,it.d||0); }

/* photo lookup.
   Three ways a photo can arrive, in order of precedence:
     1. a folder the person picked on their own machine (object URLs)
     2. prepared files from prep_props.py — thumb/ and web/ copies, paths in manifest.json
     3. the original Dropbox names sitting flat in category subfolders          */
function urlFor(it, i, size){
  const files = it.files || [];
  if(!files[i]) return null;
  const b = imgBase ? (imgBase.endsWith("/") ? imgBase : imgBase+"/") : "";
  if(manifestMode){
    return b + size + "/" + files[i].split("/").map(encodeURIComponent).join("/");
  }
  if(!imgBase) return null;
  const sub = (useFolders && FOLDERS[it.cat]) ? encodeURIComponent(FOLDERS[it.cat])+"/" : "";
  return b + sub + encodeURIComponent(files[i]);
}
function photosFor(it, size){
  const picked = imgMap[it.sku];
  if(picked && picked.length) return picked;
  return (it.files||[]).map((f,i)=> urlFor(it,i,size||"thumb")).filter(Boolean);
}
function photoFor(it){ const p = photosFor(it); return p.length ? p[0] : null; }
function skuFromFilename(fn){
  const base = fn.split("/").pop();
  const m = base.match(/^(\d{2})[._\-\s]?(\d{2})/);
  return m ? m[1]+"."+m[2] : null;
}

/* the scale rule: a 100 cm frame with the prop's footprint drawn to size */
function scaleSVG(it){
  const L=100, W=it.w||it.h||0, H=it.h||it.d||0;
  if(!W && !H) return '<svg class="scale" viewBox="0 0 200 16"></svg>';
  const bw = Math.min(W,L)/L*200, bh = Math.max(2,Math.min(H,40)/40*12);
  const over = (W>L);
  return `<svg class="scale" viewBox="0 0 200 16" aria-hidden="true">
    <line x1="0" y1="15" x2="200" y2="15" stroke="var(--rule)" stroke-width="1"/>
    ${[0,50,100,150,200].map(x=>`<line x1="${x}" y1="11" x2="${x}" y2="15" stroke="var(--rule)" stroke-width="1"/>`).join("")}
    <rect x="0" y="${15-bh}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${over?'var(--ink)':'var(--blue)'}" opacity=".85"/>
  </svg>`;
}

function toast(msg){
  const t = el("div","toast",esc(msg));
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1900);
}

/* ============================================================
   FILTER + RENDER
   ============================================================ */
function filtered(){
  const q = state.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  return items.filter(it=>{
    if(state.cat!=="all" && it.cat!==state.cat) return false;
    if(state.gap==="specs" && !needsSpecs(it)) return false;
    if(state.gap==="photo" && !needsPhoto(it)) return false;
    if(state.gap==="ready" && (needsSpecs(it)||needsPhoto(it))) return false;
    if(state.material!=="all" && !materialsOf(it).includes(state.material)) return false;
    if(state.maxH && longest(it) > state.maxH) return false;
    if(state.minQty>1 && (it.qty||1) < state.minQty) return false;
    if(terms.length){
      const hay = (it.sku+" "+it.name+" "+it.desc+" "+(CATS[it.cat]||"")+" "+materialsOf(it).join(" ")).toLowerCase();
      return terms.every(t=>hay.includes(t));
    }
    return true;
  }).sort((a,b)=>{
    if(state.sort==="sku") return a.sku.localeCompare(b.sku);
    if(state.sort==="name") return a.name.localeCompare(b.name);
    if(state.sort==="big") return longest(b)-longest(a);
    if(state.sort==="small") return (longest(a)||999)-(longest(b)||999);
    if(state.sort==="qty") return (b.qty||1)-(a.qty||1);
    return 0;
  });
}

function cardFor(it){
  const b = el("button","card");
  b.type="button";
  const shots = photosFor(it);
  const src = shots[0] || null;
  const inReq = req[it.sku]||0;
  b.innerHTML = `
    <div class="thumb">
      <span class="sku">${esc(it.sku)}</span>
      ${(it.qty||1)>1?`<span class="qty">×${it.qty}</span>`:""}
      ${src?`<img loading="lazy" alt="${esc(it.name)}" src="${esc(src)}">`
           :`<span class="ph">no photo linked<br>${esc(it.src)}</span>`}
      ${shots.length>1?`<span class="shots">${shots.length} shots</span>`:""}
    </div>
    <div class="name">${esc(it.name)}</div>
    <div class="dims">${esc(dimsLine(it))}</div>
    ${pricing.show?`<div class="rate">${esc(money(priceOf(it)))} <span>/ week</span></div>`:""}
    ${scaleSVG(it)}
    ${needsSpecs(it)?`<div class="todo">needs measuring</div>`:""}
    ${needsPhoto(it)?`<div class="todo">needs a photo</div>`:""}
    ${inReq?`<div class="inreq">${inReq} on request list</div>`:""}`;

  if(img) img.onerror = ()=>{ img.replaceWith(Object.assign(document.createElement("span"),{className:"ph",textContent:"photo not found"})); };
  b.onclick = ()=> openDetail(it);
  return b;
}

function render(rebuildControls=true){
  if(rebuildControls) renderControls();
  const list = filtered();
  const out = document.getElementById("results");
  out.innerHTML = "";

  const gaps = items.filter(i=>needsSpecs(i)||needsPhoto(i)).length;
  document.getElementById("damageTerms").textContent = damageTerms();
  document.getElementById("tally").innerHTML =
    `<b>${list.length}</b> of ${items.length} props` + (gaps?` · ${gaps} still to finish`:"");
  document.getElementById("footcount").textContent = items.length+" props catalogued";
  document.getElementById("reqCount").textContent = Object.values(req).reduce((a,b)=>a+b,0);

  if(!list.length){
    const e = el("div","empty");
    e.innerHTML = `<h3>Nothing on this shelf</h3>
      <p>No prop matches that search. Try a material (“wood”), an object (“jar”), or a catalogue number like 01.23.</p>`;
    const btn = el("button","bigbtn ghost","Clear filters");
    btn.onclick=()=>{ state.q=""; document.getElementById("q").value=""; state.cat="all"; state.material="all"; state.maxH=null; state.minQty=1; render(); };
    e.appendChild(btn);
    out.appendChild(e);
    return;
  }

  const groups = {};
  list.forEach(i=> (groups[i.cat] ||= []).push(i));
  Object.keys(groups).sort().forEach(k=>{
    const hd = el("div","sectionhead");
    hd.innerHTML = `<span class="num">${esc(k)}</span><h2>${esc(CATS[k]||"Uncatalogued")}</h2><span class="rule"></span><span class="cnt">${groups[k].length}</span>`;
    out.appendChild(hd);
    const g = el("div","grid");
    groups[k].forEach(it=> g.appendChild(cardFor(it)));
    out.appendChild(g);
  });
}

/* ============================================================
   PRICING
   Priced by the week, the way prop houses generally do it.
   Each prop sits in a band; a band is a weekly rate. Extra weeks
   are charged at a reduced rate. Nothing is per-day.
   ============================================================ */
let pricing = {
  v: 3,                       // bump when a default changes, so saved settings follow
  show: true,                 // show prices to whoever opens the page
  currency: "€",
  bands: {A:3, B:6, C:12, D:25, E:50},
  extraWeek: 0.5,             // weeks after the first, as a fraction of the first
  minOrder: 50,               // net of VAT — below this, the order isn't worth handling
  vat: 22,                    // Slovenian standard rate
  vatIncluded: false,
  lossMultiple: 4,            // lost or unrepairable: this many times the weekly rate
  damageText: ""              // leave empty to use the wording below
};

/* The terms that appear at the foot of the page, the request and the PDF. */
function damageTerms(){
  if(pricing.damageText.trim()) return pricing.damageText.trim();
  return `Props remain the hirer’s responsibility from collection until they are back `
    + `on our shelves, transport included. Anything returned damaged is charged at the `
    + `cost of repair. Anything lost, or damaged beyond repair, is charged at `
    + `${pricing.lossMultiple} times its weekly hire rate, counted per piece rather than per set.`;
}

/* a sensible starting band from what the thing is, then how big it is.
   Length alone is a poor guide — a 30 cm wooden spoon is not a 30 cm pot. */
function autoBand(it){
  const hay = (it.name+" "+it.desc).toLowerCase();
  const big = Math.max(it.h||0, it.w||0, it.d||0);
  const step = (b,n)=>{ const o="ABCDE"; return o[Math.min(4, Math.max(0, o.indexOf(b)+n))]; };

  // powered things carry real risk and replacement cost
  if(/electric|induction|infrared|kettle|mixer|coffee maker|thermometer/.test(hay))
    return big >= 30 ? "D" : "C";
  // scales, stands, holders — mid-value hardware
  if(/scale|stand|holder|dispenser|knife holder/.test(hay)) return big >= 30 ? "C" : "B";
  // hand tools: thin, cheap, quick to replace, however long they are
  if(/spoon|knife|ladle|whisk|tong|tweezer|brush|scoop|zester|fork|needle|spatula|trier|sieve|grater|juicer|funnel/.test(hay))
    return big >= 40 ? "B" : "A";
  // flat goods priced off footprint
  if(/board|tray|trivet|menu|folder|blackboard/.test(hay))
    return big >= 70 ? "D" : big >= 40 ? "C" : "B";
  // vessels and containers
  if(/jar|shaker|bottle|cup|bowl|basket|pot|glass/.test(hay))
    return big >= 30 ? "C" : big >= 15 ? "B" : "A";
  // display pieces tend to be the nice things
  if(/cloche|cake stand|ice bucket|prosciutto stand|condiment/.test(hay))
    return big >= 20 ? "D" : "C";
  if(/apron|glove/.test(hay)) return "B";

  if(!big) return "B";                                 // unmeasured, middle of the road
  return big >= 60 ? "D" : big >= 30 ? "C" : big >= 15 ? "B" : "A";
}
const bandOf = it => it.band || autoBand(it);
function priceOf(it){
  if(typeof it.price === "number") return it.price;    // explicit price wins
  return pricing.bands[bandOf(it)] ?? 0;
}
function money(n){
  const v = Math.round(n*100)/100;
  return pricing.currency + (v % 1 === 0 ? v.toFixed(0) : v.toFixed(2));
}
function weeksFor(){
  const d = rentalDays();
  if(!d) return 1;
  return Math.max(1, Math.ceil(d/7));
}
/* first week in full, later weeks discounted */
function weekUnits(){
  const w = weeksFor();
  return 1 + (w-1) * pricing.extraWeek;
}
function quote(){
  const units = weekUnits();
  const rows = lines().map(r=>{
    const it = items.find(i=>i.sku===r.sku);
    const rate = priceOf(it);
    return Object.assign({}, r, {rate, total: rate * r.qty * units});
  });
  const sub = rows.reduce((a,r)=>a+r.total, 0);
  const topUp = sub > 0 && sub < pricing.minOrder ? pricing.minOrder - sub : 0;
  const net = sub + topUp;
  const vat = pricing.vatIncluded ? 0 : net * pricing.vat/100;
  return {rows, units, weeks: weeksFor(), sub, topUp, net, vat, total: net + vat};
}

/* ============================================================
   PDF + SENDING
   ============================================================ */
const SEND_TO = "bonino@magnets-studio.com";
let formCfg = { endpoint:"https://api.web3forms.com/submit", key:"", attach:true };

function newRef(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return `MS-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function saveBlob(blob, filename){
  const a = el("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function fmtDate(s){
  if(!s) return "—";
  const d = new Date(s+"T00:00:00");
  return isNaN(d) ? s : d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
function rentalDays(){
  if(!meta.out || !meta.back) return null;
  const a = new Date(meta.out), b = new Date(meta.back);
  if(isNaN(a)||isNaN(b)||b<a) return null;
  return Math.max(1, Math.round((b-a)/86400000));
}
function billing(){
  return meta.sameBill
    ? {name: meta.production, vat: meta.vat, address: meta.address, po: meta.po}
    : {name: meta.billTo || meta.production, vat: meta.vat, address: meta.address, po: meta.po};
}
function lines(){
  return Object.keys(req).sort().map(sku=>{
    const it = items.find(i=>i.sku===sku);
    return it ? {sku, name:it.name, qty:req[sku], dims:dimsLine(it), cat:CATS[it.cat]||it.cat} : null;
  }).filter(Boolean);
}

function buildPDF(ref){
  const J = window.jspdf && window.jspdf.jsPDF;
  if(!J) throw new Error("PDF library didn’t load — check the connection, or use Copy as text");
  const doc = new J({unit:"mm", format:"a4"});
  const L=18, R=192, W=R-L;
  const bill = billing(), rows = lines(), days = rentalDays();
  let y = 20;

  const rule = (yy, w=0.2)=>{ doc.setLineWidth(w); doc.setDrawColor(150); doc.line(L,yy,R,yy); };
  const label = (t,x,yy)=>{ doc.setFont("helvetica","normal"); doc.setFontSize(7);
    doc.setTextColor(130); doc.text(t.toUpperCase(),x,yy); doc.setTextColor(20); };
  const value = (t,x,yy,size=10,style="normal")=>{ doc.setFont("helvetica",style);
    doc.setFontSize(size); doc.text(String(t||"—"),x,yy); };

  doc.setFont("helvetica","bold"); doc.setFontSize(19);
  doc.text("PROP RENTAL REQUEST", L, y);
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(110);
  doc.text("Magnets Studio · Prop House · Ljubljana", L, y+5.5);
  doc.setFontSize(10); doc.setTextColor(20);
  doc.text(ref, R, y, {align:"right"});
  doc.setFontSize(8.5); doc.setTextColor(110);
  doc.text(new Date().toLocaleDateString("en-GB"), R, y+5.5, {align:"right"});
  doc.setTextColor(20);
  y += 11; rule(y, 0.5); y += 8;

  const colB = L + W/2 + 4, colW = W/2 - 6;
  label("Production", L, y); label("Invoice to", colB, y); y += 5;
  value(meta.production, L, y, 11, "bold");
  value(bill.name, colB, y, 11, "bold");

  let yl = y + 5.4, yr = y + 5.4;                     // the two columns run on separately
  doc.setFont("helvetica","normal"); doc.setFontSize(9);
  if(meta.project){
    const pr = doc.splitTextToSize("Project: "+meta.project, colW);
    doc.text(pr, L, yl); yl += pr.length*4.4;
  }
  if(bill.vat){ doc.text("VAT "+bill.vat, colB, yr); yr += 4.4; }
  if(bill.po){ doc.text("Ref/PO "+bill.po, colB, yr); yr += 4.4; }
  if(bill.address){
    const addr = doc.splitTextToSize(bill.address, colW);
    doc.text(addr, colB, yr); yr += addr.length*4.4;
  }
  y = Math.max(yl, yr) + 5;

  label("Contact", L, y); y += 5;
  const contact = [meta.contact, meta.email, meta.phone].filter(Boolean).join("  ·  ");
  value(contact, L, y, 9.5); y += 9;

  rule(y); y += 7;
  const third = W/3;
  label("Pick-up", L, y); label("Return", L+third, y); label("Duration", L+third*2, y); y += 5.5;
  value(fmtDate(meta.out) + (meta.outTime? "  "+meta.outTime : ""), L, y, 10.5, "bold");
  value(fmtDate(meta.back) + (meta.backTime? "  "+meta.backTime : ""), L+third, y, 10.5, "bold");
  value(days ? days + (days===1?" day":" days") : "—", L+third*2, y, 10.5, "bold");
  y += 8; rule(y, 0.5); y += 8;

  const priced = pricing.show;
  const q = priced ? quote() : null;
  const total = rows.reduce((a,r)=>a+r.qty,0);
  label(`Props requested — ${rows.length} ${rows.length===1?"line":"lines"}, ${total} ${total===1?"piece":"pieces"}`, L, y);
  y += 6;
  const head = ()=>{
    doc.setFontSize(7); doc.setTextColor(130);
    doc.text("NO.", L, y); doc.text("PROP", L+16, y); doc.text("SIZE", L+82, y);
    if(priced){
      doc.text("QTY", L+128, y, {align:"right"});
      doc.text("RATE/WK", L+152, y, {align:"right"});
      doc.text("TOTAL", R, y, {align:"right"});
    } else {
      doc.text("QTY", R, y, {align:"right"});
    }
    doc.setTextColor(20); y += 2; rule(y); y += 5;
  };
  head();

  rows.forEach((r,i)=>{
    if(y > 252){ doc.addPage(); y = 22; head(); }
    const qr = q ? q.rows[i] : null;
    doc.setFont("helvetica","normal"); doc.setFontSize(9);
    doc.setTextColor(110); doc.text(r.sku, L, y);
    doc.setTextColor(20);
    doc.text(doc.splitTextToSize(r.name, priced?62:76)[0], L+16, y);
    doc.setTextColor(110); doc.setFontSize(7.5);
    doc.text(doc.splitTextToSize(r.dims, 42)[0], L+82, y);
    doc.setTextColor(20); doc.setFontSize(9);
    if(priced){
      doc.text("×"+r.qty, L+128, y, {align:"right"});
      doc.setTextColor(110); doc.text(money(qr.rate), L+152, y, {align:"right"});
      doc.setTextColor(20); doc.setFont("helvetica","bold");
      doc.text(money(qr.total), R, y, {align:"right"});
    } else {
      doc.setFont("helvetica","bold"); doc.setFontSize(9.5);
      doc.text("×"+r.qty, R, y, {align:"right"});
    }
    y += 4.2; doc.setDrawColor(225); doc.setLineWidth(0.1); doc.line(L,y,R,y); y += 4.2;
  });

  if(priced){
    if(y > 238){ doc.addPage(); y = 22; }
    y += 3;
    const money2 = (lbl, val, bold)=>{
      doc.setFont("helvetica", bold?"bold":"normal");
      doc.setFontSize(bold?11:9);
      doc.setTextColor(bold?20:110); doc.text(lbl, L+108, y);
      doc.setTextColor(20); doc.text(val, R, y, {align:"right"});
      y += bold?6:4.8;
    };
    money2(q.weeks===1 ? "Props, one week" : `Props, ${q.weeks} weeks`, money(q.sub));
    if(q.topUp) money2("Minimum order top-up", money(q.topUp));
    if(!pricing.vatIncluded) money2(`VAT ${pricing.vat}%`, money(q.vat));
    doc.setDrawColor(150); doc.setLineWidth(0.3); doc.line(L+108, y-2, R, y-2); y += 2;
    money2("Estimate", money(q.total), true);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(130);
    const terms = q.weeks>1
      ? `First week at full rate, ${q.weeks-1} further at ${Math.round(pricing.extraWeek*100)}%. Minimum hire one week.`
      : `Minimum hire one week.`;
    const tl = doc.splitTextToSize(terms, R-(L+108));
    doc.text(tl, L+108, y); doc.setTextColor(20); y += tl.length*3.4 + 4;
  }

  if(meta.notes){
    y += 4; label("Notes", L, y); y += 5;
    doc.setFont("helvetica","normal"); doc.setFontSize(9);
    const nn = doc.splitTextToSize(meta.notes, W);
    doc.text(nn, L, y); y += nn.length*4.4;
  }

  // damage and loss — must always land whole, never split across a page
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
  const dt = doc.splitTextToSize(damageTerms(), W);
  const blockH = 12 + dt.length*4;
  if(y + blockH > 278){ doc.addPage(); y = 22; }
  y += 8; rule(y, 0.4); y += 6;
  label("Damage & loss", L, y); y += 5;
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(60);
  doc.text(dt, L, y); doc.setTextColor(20); y += dt.length*4;

  const pages = doc.internal.getNumberOfPages();
  for(let p=1; p<=pages; p++){
    doc.setPage(p);
    doc.setFontSize(7.5); doc.setTextColor(140);
    doc.text(`${ref} · request only, not a confirmed booking until Magnets Studio replies`, L, 287);
    doc.text(`${p}/${pages}`, R, 287, {align:"right"});
  }

  const who = (meta.production||bill.name||"request").replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").toLowerCase();
  return {blob: doc.output("blob"), filename: `${ref}-${who||"prop-request"}.pdf`, ref};
}

function validate(){
  const miss = [];
  if(!Object.keys(req).length) miss.push("at least one prop");
  if(!meta.production.trim()) miss.push("production company");
  if(!meta.contact.trim()) miss.push("contact name");
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(meta.email.trim())) miss.push("a valid email");
  if(!meta.out) miss.push("a pick-up date");
  if(meta.out && meta.back && new Date(meta.back) < new Date(meta.out))
    miss.push("a return date that isn’t before the pick-up");
  return miss;
}

async function submitRequest(btn){
  const miss = validate();
  if(miss.length){ toast("still needed: " + miss.join(", ")); return; }

  const ref = newRef();
  let pdf = null;
  try{ pdf = buildPDF(ref); }
  catch(err){ toast(err.message); }

  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Sending…";

  const fd = new FormData();
  if(formCfg.key) fd.append("access_key", formCfg.key);
  fd.append("subject", `Prop request ${ref} — ${meta.production}`);
  fd.append("from_name", "Magnets Studio prop house");
  fd.append("email", meta.email);
  fd.append("replyto", meta.email);
  fd.append("reference", ref);
  fd.append("message", requestText(ref));
  if(pdf && formCfg.attach) fd.append("attachment", pdf.blob, pdf.filename);

  let ok = false, why = "";
  if(!formCfg.endpoint || !formCfg.key){
    why = "no form service set up yet";
  } else {
    try{
      const r = await fetch(formCfg.endpoint, {method:"POST", body:fd});
      ok = r.ok;
      if(!ok) why = "the form service replied " + r.status;
    }catch(e){ why = "couldn’t reach the form service"; }
  }

  btn.disabled = false; btn.textContent = label;
  if(pdf) saveBlob(pdf.blob, pdf.filename);
  showResult(ok, ref, why, pdf);
}

function mailtoLink(ref){
  return "mailto:" + SEND_TO
    + "?subject=" + encodeURIComponent(`Prop request ${ref} — ${meta.production}`)
    + "&body=" + encodeURIComponent(requestText(ref) + "\n\n(The PDF has been saved to your downloads — please attach it.)");
}

function showResult(ok, ref, why, pdf){
  const n = el("div","sheet");
  n.style.maxWidth = "560px";
  n.innerHTML = `
    <div class="hd"><span class="t">${ok?"Request sent":"Not sent"}</span><button class="x" aria-label="Close">×</button></div>
    <div class="panel">
      <h4 style="margin-top:0">${ok?"On its way to Magnets Studio":"The email didn’t go through"}</h4>
      <p>${ok
        ? `Reference <code>${esc(ref)}</code>. It’s gone to <code>${esc(SEND_TO)}</code>, and a copy of the PDF has been saved to your downloads. Nothing is reserved until the studio replies.`

  n.querySelector(".x").onclick = closeOverlay;

}


/* ============================================================
   ADMIN
   A static page cannot authenticate anyone: everything it knows,
   the visitor's browser knows too. This gate hides the editing
   controls from people who shouldn't be poking at them. It is a
   lock on a cupboard, not a safe. Real protection comes from the
   host — see the note in the admin panel.
   ============================================================ */
let isAdmin = false, published = null, dirty = false;

const hex = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");

async function derive(pass, saltHex){
  const enc = new TextEncoder();
  const salt = saltHex ? Uint8Array.from(saltHex.match(/../g).map(h=>parseInt(h,16)))
                       : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    {name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"}, key, 256);
  return {hash: hex(bits), salt: hex(salt.buffer ? salt : salt)};
}

/* default passphrase is "magnets" — the panel nags until it's changed */
let gate = { salt:"", hash:"", isDefault:true };

async function checkPass(pass){
  if(!gate.hash){                                  // never set: accept the default once
    const d = await derive("magnets", null);
    gate = {salt:d.salt, hash:d.hash, isDefault:true};
  }
  const d = await derive(pass, gate.salt);
  return d.hash === gate.hash;
}

function markDirty(){
  dirty = true;
  const b = document.getElementById("adminBar");
  if(b) b.classList.add("dirty");
  updateAdminBar();
}

function updateAdminBar(){
  const b = document.getElementById("adminBar");
  if(!b) return;
  b.querySelector(".state").textContent = dirty
    ? "unpublished changes on this device"
    : "in step with the published site";
}

function showAdminBar(){
  if(document.getElementById("adminBar")) return;
  const bar = document.createElement("div");
  bar.id = "adminBar"; bar.className = "adminbar";
  bar.innerHTML = `<span class="tag">Admin</span><span class="state"></span>
    <span class="sp"></span>
    <button class="topbtn" id="aPublish">Publish</button>
    <button class="topbtn" id="aExit">Leave admin</button>`;
  document.body.appendChild(bar);
  document.body.classList.add("hasbar");
  bar.querySelector("#aPublish").onclick = publish;
  bar.querySelector("#aExit").onclick = ()=>{
    isAdmin = false; store.set("mag.admin", false);
    bar.remove(); document.body.classList.remove("hasbar");
    document.getElementById("btnSettings").classList.add("hidden");
    render();
  };
  updateAdminBar();
}

/* ---------- publishing ---------- */
function siteData(){
  return {
    version: 1,
    generated: new Date().toISOString(),
    cats: CATS, folders: FOLDERS, manifestMode,
    imgBase, useFolders,
    items: items.map(i=>({sku:i.sku, cat:i.cat, name:i.name, src:i.src,
      h:i.h, w:i.w, d:i.d, qty:i.qty, qtyNote:i.qtyNote||null,
      desc:i.desc, price:(typeof i.price === "number" ? i.price : null),
      band:i.band||null, files:i.files||[]})),
    pricing, form: formCfg, gate
  };
}

function publish(){
  const blob = new Blob([JSON.stringify(siteData(), null, 1)], {type:"application/json"});
  saveBlob(blob, "catalogue.json");
  dirty = false;
  document.getElementById("adminBar").classList.remove("dirty");
  updateAdminBar();
  const n = el("div","sheet"); n.style.maxWidth = "520px";
  n.innerHTML = `
    <div class="hd"><span class="t">Publishing</span><button class="x" aria-label="Close">×</button></div>
    <div class="panel">
      <h4 style="margin-top:0">catalogue.json is in your downloads</h4>
      <p>That one file carries the whole catalogue — props, sizes, prices, terms, photo links. The site reads it on load, so until you upload it, visitors still see the previous version.</p>
      <p><b>To put it live:</b> drop it into your <code>props-web</code> folder next to <code>index.html</code>, replacing the old one, then drag the folder onto Netlify again. About thirty seconds.</p>
      <p class="note">Adding photos? Run the photo prep tool over the whole Dropbox folder first, upload the new <code>props-web</code>, then load the fresh <code>manifest.json</code> here and publish again.</p>
    </div>`;
  n.querySelector(".x").onclick = closeOverlay;
  openOverlay(n);
}

function applySiteData(dz){
  if(!dz || !dz.items) return false;
  items = dz.items.map(i=> Object.assign({}, i));
  if(dz.cats) CATS = dz.cats;
  if(dz.folders) FOLDERS = Object.assign(FOLDERS, dz.folders);
  if(dz.pricing) pricing = Object.assign(pricing, dz.pricing);
  if(dz.form) formCfg = Object.assign(formCfg, dz.form);
  if(dz.gate && dz.gate.hash) gate = dz.gate;
  if(typeof dz.imgBase === "string") imgBase = dz.imgBase;
  if(typeof dz.useFolders === "boolean") useFolders = dz.useFolders;
  if(dz.manifestMode) manifestMode = true;
  return true;
}

    <div class="panel">
      <div class="pricegrid" style="grid-template-columns:1fr 2fr">

        <div><label for="eName">Name</label><input type="text" id="eName" value="${esc(p.name)}"></div>
      </div>
      <div class="pricegrid">

        <div><label for="eW">Width cm</label><input type="number" id="eW" step="0.1" value="${p.w??""}"></div>
        <div><label for="eD">Depth cm</label><input type="number" id="eD" step="0.1" value="${p.d??""}"></div>
        <div><label for="eQ">In stock</label><input type="number" id="eQ" min="1" value="${p.qty||1}"></div>
      </div>
      <div class="pricegrid" style="grid-template-columns:1fr 1fr 2fr">
        <div><label for="ePrice">Price/week</label><input type="number" id="ePrice" step="0.5" value="${typeof p.price==="number"?p.price:""}" placeholder="auto"></div>
        <div><label for="eBand">Band</label><input type="text" id="eBand" value="${esc(p.band||"")}" placeholder="auto (${esc(bandOf(p))})"></div>
        <div><label for="eCat">Shelf</label><input type="text" id="eCat" value="${esc(p.cat)}" placeholder="01"></div>
      </div>
      <p style="margin-top:12px"><label for="eDesc" style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)">Description</label></p>
      <textarea id="eDesc" style="height:70px">${esc(p.desc||"")}</textarea>
      <p style="margin-top:12px"><label for="eFiles" style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)">Photo files, one per line</label></p>
      <textarea id="eFiles" style="height:60px">${esc((p.files||[]).join("\n"))}</textarea>
      <div class="rowbtns">
        <button class="bigbtn" id="eSave">${isNew?"Add it":"Save"}</button>
        ${isNew?"":`<button class="linkbtn" id="eDel">Delete this prop</button>`}
        <span class="mono" id="eMsg" style="font-size:11px;color:var(--soft)"></span>
      </div>
    </div>`;
  n.querySelector(".x").onclick = closeOverlay;
  n.querySelector("#eSave").onclick = ()=>{
    const g = id => n.querySelector(id).value.trim();
    const sku = g("#eSku");
    if(!/^\d{2}\.\d{2}$/.test(sku)){ n.querySelector("#eMsg").textContent = "number must look like 04.01"; return; }
    if(isNew && items.some(i=>i.sku===sku)){ n.querySelector("#eMsg").textContent = sku+" already exists"; return; }
    const cat = g("#eCat") || sku.slice(0,2);
    const rec = {
      sku, cat, name: g("#eName") || "Untitled prop",
      src: p.src || (sku+"_"+(g("#eName")||"prop").toLowerCase()),
      h: num(g("#eH")), w: num(g("#eW")), d: num(g("#eD")),
      qty: Math.max(1, parseInt(g("#eQ"),10) || 1),
      qtyNote: p.qtyNote || null,
      desc: n.querySelector("#eDesc").value.trim(),
      price: g("#ePrice") === "" ? undefined : (num(g("#ePrice")) ?? undefined),
      band: g("#eBand").toUpperCase() || null,
      files: n.querySelector("#eFiles").value.split(/\n+/).map(x=>x.trim()).filter(Boolean)
    };
    if(rec.price === undefined) delete rec.price;
    if(!CATS[cat]) CATS[cat] = "Shelf "+cat;
    const at = items.findIndex(i=> i.sku === (it ? it.sku : sku));
    if(at >= 0) items[at] = rec; else items.push(rec);
    items.sort((a,b)=>a.sku.localeCompare(b.sku));
    store.set("mag.items", items); store.set("mag.cats", CATS);
    markDirty(); closeOverlay(); render(); toast(isNew ? sku+" added" : sku+" saved");
  };
  const del = n.querySelector("#eDel");
  if(del) del.onclick = ()=>{
    if(del.dataset.sure !== "1"){ del.dataset.sure = "1"; del.textContent = "Really delete?"; return; }
    items = items.filter(i=> i.sku !== it.sku);
    delete req[it.sku];
    store.set("mag.items", items); saveReq();
    markDirty(); closeOverlay(); render(); toast(it.sku+" deleted");
  };
  openOverlay(n);
}

  pLoss.value = pricing.lossMultiple; pDmg.value = pricing.damageText;
  const preview = ()=>{
    const keep = [pricing.lossMultiple, pricing.damageText];
    pricing.lossMultiple = Math.max(1, parseInt(pLoss.value,10) || 4);
    pricing.damageText = pDmg.value;
    dmgPrev.textContent = damageTerms();
    [pricing.lossMultiple, pricing.damageText] = keep;
  };
  pLoss.oninput = preview; pDmg.oninput = preview; preview();

  n.querySelector("#savePrice").onclick = ()=>{
    const bands = {};
    Object.keys(pricing.bands).forEach(b=>{
      const v = parseFloat(n.querySelector("#band"+b).value);
      bands[b] = isNaN(v) ? pricing.bands[b] : Math.max(0, v);
    });
    pricing = {
      show: pShow.checked, currency: pCur.value.trim() || "€", bands,
      extraWeek: Math.min(1, Math.max(0, (parseFloat(pExtra.value)||0)/100)),
      minOrder: Math.max(0, parseFloat(pMin.value)||0),
      vat: Math.max(0, parseFloat(pVat.value)||0),
      vatIncluded: pInc.checked,
      lossMultiple: Math.max(1, parseInt(pLoss.value,10) || 4),
      damageText: pDmg.value
    };
    pricing.v = 3; store.set("mag.pricing", pricing); if(isAdmin) markDirty();
    render();
    n.querySelector("#pStat").textContent = "saved";
  };

  if(gate.isDefault || !gate.hash)
    n.querySelector("#passNag").innerHTML =
      `<p class="warn"><b>Still on the default passphrase</b> (<code>magnets</code>). Change it below, then publish.</p>`;
  const fKey = n.querySelector("#fKey"), fEnd = n.querySelector("#fEnd"), fAtt = n.querySelector("#fAttach");
  fKey.value = formCfg.key; fEnd.value = formCfg.endpoint; fAtt.checked = formCfg.attach;
  n.querySelector("#saveForm").onclick = ()=>{
    formCfg = {key:fKey.value.trim(), endpoint:fEnd.value.trim(), attach:fAtt.checked};
    store.set("mag.form", formCfg);
    n.querySelector("#fStat").textContent = formCfg.key ? "saved" : "no key — requests will fall back to email";
  };
  n.querySelector("#testForm").onclick = async ()=>{
    const stat = n.querySelector("#fStat");
    if(!fKey.value.trim()){ stat.textContent = "add an access key first"; return; }
    stat.textContent = "sending…";
    const fd = new FormData();
    fd.append("access_key", fKey.value.trim());
    fd.append("subject", "Prop house — test request");
    fd.append("from_name", "Magnets Studio prop house");
    fd.append("message", "This is a test from the prop house catalogue. If it reached you, requests will too.");
    try{
      const r = await fetch(fEnd.value.trim() || formCfg.endpoint, {method:"POST", body:fd});
      stat.textContent = r.ok ? "sent — check the inbox" : "rejected with " + r.status;
    }catch(e){ stat.textContent = "couldn’t reach the service"; }
  };

  // access + publishing
  n.querySelector("#setPass").onclick = async ()=>{
    const a = n.querySelector("#npass").value, b = n.querySelector("#npass2").value;
    const st = n.querySelector("#passStat");
    if(a.length < 8){ st.textContent = "at least 8 characters"; return; }
    if(a !== b){ st.textContent = "those don’t match"; return; }
    st.textContent = "hashing…";
    const d = await derive(a, null);
    gate = {salt:d.salt, hash:d.hash, isDefault:false};
    markDirty();
    st.textContent = "set — publish to make it live";
    n.querySelector("#npass").value = ""; n.querySelector("#npass2").value = "";
  };
  n.querySelector("#pubNow").onclick = ()=>{ closeOverlay(); publish(); };
  n.querySelector("#loadSite").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        if(!applySiteData(JSON.parse(r.result))) throw new Error("no props in that file");
        store.set("mag.items", items); store.set("mag.cats", CATS);
        store.set("mag.pricing", pricing); store.set("mag.form", formCfg);
        render();
        n.querySelector("#pubStat").textContent = items.length + " props loaded";
      }catch(err){ n.querySelector("#pubStat").textContent = "couldn’t read that — " + err.message; }
    };
    r.readAsText(f);
  };

  n.querySelector("#resetCat").onclick = ()=>{ items = SEED.slice(); CATS={"01":"Kitchen","02":"Restaurant","03":"Dining room"}; manifestMode=false; store.set("mag.items",null); store.set("mag.manifest",false); render(); toast("built-in catalogue restored"); };
  n.querySelector("#expAll").onclick = ()=>{
    const rows=[["SKU","Category","Name","Height","Width","Depth","Quantity","Description","Price","Band","Photo files"]];
    items.forEach(i=>rows.push([i.sku,CATS[i.cat]||i.cat,i.name,i.h??"",i.w??"",i.d??"",i.qty??"",i.desc||"",priceOf(i),bandOf(i),(i.files||[]).join(" | ")]));
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=el("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="magnets-prop-catalogue.csv"; a.click(); URL.revokeObjectURL(a.href);
  };

  openOverlay(n);
}

/* take the manifest.json written by prep_props.py and re-point every prop at it */
function applyManifest(mf){
  if(!mf || !mf.props) throw new Error("that file has no props in it");
  const cats = Object.assign({}, CATS);
  Object.entries(mf.folders||{}).forEach(([k,v])=>{
    FOLDERS[k] = v;
    if(!cats[k]) cats[k] = String(v).replace(/^\d+\s*[-–]\s*/,"") || ("Shelf "+k);
  });
  const bySku = {}; items.forEach(i=> bySku[i.sku] = i);
  let matched = 0, added = 0;
  Object.entries(mf.props).forEach(([sku, rec])=>{
    const files = rec.files || [];
    if(bySku[sku]){ bySku[sku].files = files; matched++; return; }
    const cat = rec.cat || sku.slice(0,2);
    const stem = (files[0]||sku).split("/").pop().replace(/\.[^.]+$/,"");
    const nm = stem.replace(/^\d{2}[._\-]?\d{2}[._\-\s]*/,"").replace(/\s+\d{2}$/,"").trim();
    if(!cats[cat]) cats[cat] = "Shelf "+cat;
    items.push({sku, cat, name: nm ? nm.charAt(0).toUpperCase()+nm.slice(1) : "Untitled prop",
                src: stem, h:null, w:null, d:null, qty:1, desc:"", files});
    added++;
  });
  // props whose photos vanished from the manifest no longer have files
  items.forEach(i=>{ if(!mf.props[i.sku]) i.files = []; });
  items.sort((a,b)=>a.sku.localeCompare(b.sku));
  CATS = cats;
  manifestMode = true;
  store.set("mag.items",items); store.set("mag.cats",CATS); if(isAdmin) markDirty();
  store.set("mag.manifest",true); store.set("mag.folders2",FOLDERS);
  render();
  return {matched, added, total: Object.keys(mf.props).length};
}

/* if the page is served from inside the props-web folder, wire itself up */
async function autoManifest(){
  if(manifestMode) return false;
  try{
    const r = await fetch("manifest.json", {cache:"no-store"});
    if(!r.ok) return false;
    const res = applyManifest(await r.json());
    toast(`${res.total} photos linked`);
    return true;
  }catch(e){ return false; }
}
/* minimal CSV parser (quotes, commas, newlines) */
function parseCSV(text){
  const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else {
      if(c==='"') q=true;
      else if(c===","){ row.push(cell); cell=""; }
      else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else if(c==="\r"){}
      else cell+=c;
    }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

/* turn sheet rows into catalogue items */
function loadRows(rows){
  const next=[], cats={};
  let cur=null;
  rows.forEach(r=>{
    const a=(r[0]||"").trim();
    if(!a) return;
    if(/^name$/i.test(a)) return;                       // repeated header
    const catM = a.match(/^(\d{2})\s*[-–]\s*(.+)$/);    // "01 - Kitchen"
    if(catM){ cur=catM[1]; cats[cur]=catM[2].trim(); return; }
    const skuM = a.match(/^(\d{2})[._\-](\d{2})[._\-\s]*(.*)$/);
    if(!skuM) return;
    const cat = skuM[1];
    if(!cats[cat]) cats[cat] = CATS[cat] || ("Shelf "+cat);
    const rawQty = (r[4]||"").trim();
    let qty = parseInt(rawQty,10); if(isNaN(qty)||qty<1) qty=1;
    const nm = (skuM[3]||"").trim();
    next.push({
      sku: skuM[1]+"."+skuM[2],
      cat,
      name: nm ? nm.charAt(0).toUpperCase()+nm.slice(1) : "Untitled prop",
      src: a,
      h:num(r[1]), w:num(r[2]), d:num(r[3]),
      qty, qtyNote: /\D/.test(rawQty)&&rawQty ? rawQty : null,
      desc:(r[5]||"").trim(),
      price: num(r[6]),
      band: (r[7]||"").trim().toUpperCase() || null
    });
  });
  if(!next.length){ toast("no prop rows found in that file"); return 0; }
  // keep the photo file lists already known for each catalogue number
  const known = {}; items.forEach(i=> known[i.sku] = i.files||[]);
  const seen = new Set(next.map(i=>i.sku));
  next.forEach(i=> i.files = known[i.sku] || []);
  // props that have photos but no row in the new sheet stay in the catalogue
  items.forEach(old=>{
    if(!seen.has(old.sku) && (old.files||[]).length){
      next.push(Object.assign({},old));
      if(!cats[old.cat]) cats[old.cat] = CATS[old.cat] || ("Shelf "+old.cat);
    }
  });
  items = next; CATS = Object.assign({},cats);
  store.set("mag.items",items); store.set("mag.cats",CATS); if(isAdmin) markDirty();
  render();
  return next.length;
}

/* ============================================================
   BOOT
   ============================================================ */
document.getElementById("q").addEventListener("input", e=>{ state.q=e.target.value; render(); });
document.getElementById("btnReq").onclick = openDrawer;
document.getElementById("btnSettings").onclick = openSettings;

(async function boot(){
  /* The published catalogue.json is the source of truth for everyone.
     Local edits are a draft that only the admin sees, until they publish. */
  let hasPublished = false;
  try{
    const r = await fetch("catalogue.json", {cache:"no-store"});
    if(r.ok) hasPublished = applySiteData(await r.json());
  }catch(e){}

  const [sr, sm, sa] = await Promise.all([
    store.get("mag.req"), store.get("mag.meta"), store.get("mag.admin")
  ]);
  if(sr) req = sr;
  if(sm) meta = Object.assign(meta, sm);

  if(sa){
    // returning admin on this device: reapply their draft over the published data
    const [si, sc, sb, sf, mf, fo, fc, pr] = await Promise.all([
      store.get("mag.items"), store.get("mag.cats"), store.get("mag.base"),
      store.get("mag.folders"), store.get("mag.manifest"), store.get("mag.folders2"),
      store.get("mag.form"), store.get("mag.pricing")
    ]);
    if(si && si.length){ items = si; dirty = true; }
    if(sc) CATS = sc;
    if(sb) imgBase = sb;
    if(sf !== null && sf !== undefined) useFolders = sf;
    if(mf) manifestMode = true;
    if(fo) FOLDERS = Object.assign(FOLDERS, fo);
    if(fc) formCfg = Object.assign(formCfg, fc);
    if(pr){
      const was = {minOrder: pricing.minOrder, lossMultiple: pricing.lossMultiple};
      pricing = Object.assign(pricing, pr);
      const v = pr.v || 1;
      if(v < 2) pricing.minOrder = was.minOrder;
      if(v < 3) pricing.lossMultiple = was.lossMultiple;
      pricing.v = 3;
    }
    isAdmin = true;
  }

  render();
  if(isAdmin){
    document.getElementById("btnSettings").classList.remove("hidden");
    showAdminBar();
  }
  if(!hasPublished) autoManifest();

  document.getElementById("studioLink").onclick = ()=> isAdmin ? publish() : askPass();
  if(location.hash === "#admin" && !isAdmin) askPass();
})();
</script>
