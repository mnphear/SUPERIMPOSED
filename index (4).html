    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #080808;
      --white: #f0ede8;
      --grey: #888580;
      --dim: #3a3835;
      --mono: 'Share Tech Mono', monospace;
      --display: 'EurostileExtended', 'Arial Black', sans-serif;
      --ui: 'Space Mono', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: var(--mono);
      overflow: hidden;
      cursor: crosshair;
    }

    .bracket {
      position: absolute;
      width: 18px; height: 18px;
      pointer-events: none;
      z-index: 10;
    }
    .bracket::before, .bracket::after {
      content: '';
      position: absolute;
      background: var(--grey);
    }
    .bracket.tl { top: 20px; left: 20px; }
    .bracket.tl::before { top:0; left:0; width:100%; height:1px; }
    .bracket.tl::after  { top:0; left:0; width:1px; height:100%; }
    .bracket.tr { top: 20px; right: 20px; }
    .bracket.tr::before { top:0; right:0; width:100%; height:1px; }
    .bracket.tr::after  { top:0; right:0; width:1px; height:100%; }
    .bracket.bl { bottom: 20px; left: 20px; }
    .bracket.bl::before { bottom:0; left:0; width:100%; height:1px; }
    .bracket.bl::after  { bottom:0; left:0; width:1px; height:100%; }
    .bracket.br { bottom: 20px; right: 20px; }
    .bracket.br::before { bottom:0; right:0; width:100%; height:1px; }
    .bracket.br::after  { bottom:0; right:0; width:1px; height:100%; }

    /* PRELOADER */
    #preloader {
      position: fixed;
      inset: 0;
      background: var(--black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #preloader.hidden { opacity: 0; visibility: hidden; }

    .preloader-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.3s forwards;
    }

    .preloader-full-logo {
      width: 220px;
      height: auto;
      display: block;
      filter: brightness(0.95);
    }

    .preloader-bar-wrap {
      position: absolute;
      bottom: 56px;
      left: 32px;
      right: 32px;
      height: 1px;
      background: var(--dim);
    }
    .preloader-bar {
      height: 100%;
      width: 0%;
      background: var(--white);
      transition: width 0.08s linear;
    }
    .preloader-bottom {
      position: absolute;
      bottom: 32px;
      left: 32px;
      right: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      animation: fadeUp 0.4s ease 0.8s forwards;
    }
    .preloader-status {
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--grey);
      text-transform: uppercase;
    }
    .preloader-pct {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--grey);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* MAIN SITE */
    #site {
      position: fixed;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease 0.2s;
      overflow: hidden;
    }
    #site.visible { opacity: 1; }

    #canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, transparent 38%, black 58%, black 100%);
      mask-image: linear-gradient(to right, transparent 0%, transparent 38%, black 58%, black 100%);
    }

    /* NAV */
    nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      padding: 18px 32px;

    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .nav-logo-mark {
      width: 42px;
      height: auto;
      display: block;
      filter: brightness(0.92);
    }
    .nav-logo-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .nav-wordmark {
      font-family: var(--display);
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--white);
      line-height: 1;
      text-transform: uppercase;
    }
    .nav-sub {
      font-family: var(--mono);
      font-size: 7.5px;
      letter-spacing: 3px;
      color: var(--grey);
      text-transform: uppercase;
    }
    .nav-links {
      display: flex;
      gap: 40px;
      margin-left: auto;
      margin-right: 24px;
      list-style: none;
    }
    .nav-links a {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--grey);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
      position: relative;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-links a.active { color: var(--white); }
    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0; right: 0;
      height: 1px;
      background: var(--white);
    }
    .nav-plus {
      font-size: 18px;
      color: var(--grey);
      cursor: pointer;
      transition: color 0.2s;
      line-height: 1;
    }
    .nav-plus:hover { color: var(--white); }

    /* HERO */
    #hero {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 32px 80px;
    }

    .hero-content {
      max-width: 580px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }
    .hero-content.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-plus {
      font-size: 18px;
      color: var(--grey);
      margin-bottom: 14px;
      display: block;
    }

    h1 {
      font-family: var(--display);
      font-size: clamp(48px, 5.8vw, 84px);
      line-height: 0.93;
      letter-spacing: 1px;
      color: var(--white);
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    .hero-desc {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 2px;
      line-height: 1.9;
      color: var(--grey);
      text-transform: uppercase;
      margin-bottom: 34px;
      max-width: 290px;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border: 1px solid var(--white);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--white);
      text-decoration: none;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
      cursor: pointer;
      background: transparent;
    }
    .hero-cta:hover {
      background: var(--white);
      color: var(--black);
    }
    .hero-cta span { font-size: 14px; }

    /* BOTTOM BAR */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-top: 1px solid var(--dim);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--grey);
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.8s ease 0.6s;
    }
    .bottom-bar.visible { opacity: 1; }

    .scanline {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
    }

    .noise {
      position: fixed;
      inset: -50%;
      width: 200%; height: 200%;
      pointer-events: none;
      z-index: 49;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      animation: noiseAnim 0.5s steps(2) infinite;
    }
    @keyframes noiseAnim {
      0%   { transform: translate(0,0); }
      25%  { transform: translate(-2%, 1%); }
      50%  { transform: translate(1%, -1%); }
      75%  { transform: translate(-1%, 2%); }
      100% { transform: translate(0,0); }
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="scanline"></div>

  <!-- PRELOADER -->
  <div id="preloader">
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (function() {
    const bar = document.getElementById('bar');
    const pct = document.getElementById('pct');
    const preloader = document.getElementById('preloader');
    const site = document.getElementById('site');
    const heroContent = document.getElementById('heroContent');
    const bottomBar = document.getElementById('bottomBar');

    let progress = 0;
    const duration = 2800;
    const start = performance.now();

    function easeInOut(t) {
      return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    }

    function tick(now) {
      const elapsed = now - start;
      const raw = Math.min(elapsed / duration, 1);
      progress = easeInOut(raw) * 100;
      bar.style.width = progress + '%';
      pct.textContent = Math.floor(progress) + '%';

      if (raw < 1) {
        requestAnimationFrame(tick);
      } else {
        bar.style.width = '100%';
        pct.textContent = '100%';
        setTimeout(() => {
          preloader.classList.add('hidden');
          site.classList.add('visible');
          setTimeout(() => {
            heroContent.classList.add('visible');
            bottomBar.classList.add('visible');
          }, 400);
        }, 400);
      }
    }
    requestAnimationFrame(tick);
  })();

  (function() {
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 1000);

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener('resize', resize);

    camera.position.set(18, 22, 42);
    camera.lookAt(18, -4, 0);

    const W = 100, H = 70, SEG_W = 100, SEG_H = 70;
    const geo = new THREE.PlaneGeometry(W, H, SEG_W, SEG_H);
    geo.rotateX(-Math.PI / 2);

    const pos = geo.attributes.position;
    const count = pos.count;
    const originalY = new Float32Array(count);

    function noise(x, z) {
      let v = 0;
      v += Math.sin(x * 0.18 + 1.2) * Math.cos(z * 0.22) * 3.4;
      v += Math.sin(x * 0.35 - 0.8) * Math.sin(z * 0.3 + 0.5) * 2.0;
      v += Math.cos(x * 0.6 + 2.1) * Math.sin(z * 0.55) * 1.1;
      v += Math.sin(x * 1.1) * Math.cos(z * 0.9 + 1.3) * 0.5;
      const dx = x - 10, dz = z + 4;
      v += Math.exp(-(dx*dx + dz*dz) * 0.011) * 7;
      const dx2 = x + 16, dz2 = z - 6;
      v += Math.exp(-(dx2*dx2 + dz2*dz2) * 0.016) * 4;
      return v;
    }

    for (let i = 0; i < count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      const y = noise(x, z);
      pos.setY(i, y);
      originalY[i] = y;
    }
    geo.computeVertexNormals();

    const mat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      wireframe: true,
      transparent: true,
      opacity: 0.13,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(20, -8, -6);
    scene.add(mesh);

    const pointsGeo = new THREE.BufferGeometry();
    const pPos = [];
    for (let i = 0; i < count; i++) {
      pPos.push(pos.getX(i), pos.getY(i), pos.getZ(i));
    }
    pointsGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
    const pointsMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.22,
      transparent: true,
      opacity: 0.7,
    });
    const points = new THREE.Points(pointsGeo, pointsMat);
    points.position.copy(mesh.position);
    scene.add(points);

    let t = 0;
    const pPosAttr = pointsGeo.attributes.position;

    function animate() {
      requestAnimationFrame(animate);
      t += 0.005;

      for (let i = 0; i < count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const wave =
          Math.sin(x * 0.14 + t) * Math.cos(z * 0.11 + t * 0.6) * 0.45 +
          Math.sin(x * 0.28 + t * 1.3) * Math.cos(z * 0.2 + t * 0.4) * 0.2;
        const newY = originalY[i] + wave;
        pos.setY(i, newY);
        pPosAttr.setY(i, newY);
      }
      pos.needsUpdate = true;
      pPosAttr.needsUpdate = true;
      geo.computeVertexNormals();

      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
